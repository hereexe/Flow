name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "^v?(\d+\.\d+\.\d+.*)$") {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          Write-Host "Building version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Self-Contained Binary
        shell: pwsh
        run: |
          dotnet publish Flow.Presentation/Flow.Presentation.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./publish/win-x64

      - name: Create Dist Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ./dist | Out-Null

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" ./installer/flow_setup.iss

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "v1.0.0" }
          $zipName = "./dist/Flow-Portable-$tag-win-x64.zip"
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath $zipName -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/Flow-Setup.exe
            ./dist/Flow-Portable-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
