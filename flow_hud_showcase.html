<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow — Full Design Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #08090e;
    --bg-surface: #0f1118;
    --bg-card: #14161f;
    --bg-card-hover: #1a1d28;
    --border-subtle: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text-primary: #e8eaf0;
    --text-secondary: #6b7084;
    --text-muted: #3d4055;
    --accent-blue: #4d8ef7;
    --accent-green: #34d399;
    --accent-red: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; top:-40%; left:-20%;
    width:80vw; height:80vh;
    background: radial-gradient(ellipse, rgba(77,142,247,0.04) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }

  /* ─── Nav Tabs ─── */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: center; gap: 2px;
    padding: 16px 24px 0;
    background: linear-gradient(180deg, var(--bg-deep) 60%, transparent);
  }
  .nav-btn {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 10px 28px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .nav-btn:hover { color: var(--text-primary); }
  .nav-btn.active {
    background: var(--bg-card);
    border-color: var(--border-subtle);
    color: var(--text-primary);
  }

  .section { display: none; position: relative; z-index: 1; }
  .section.active { display: block; }

  .header {
    text-align: center;
    padding: 48px 24px 16px;
  }
  .header-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(77,142,247,0.08);
    border: 1px solid rgba(77,142,247,0.15);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--accent-blue);
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: clamp(26px,3.5vw,38px);
    font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .header h1 span { color: var(--text-muted); font-weight: 300; }
  .header p { color: var(--text-secondary); font-size: 14px; max-width: 480px; margin: 0 auto; line-height: 1.6; }

  .state-bar {
    display: flex; justify-content: center; gap: 4px;
    padding: 12px 24px 4px;
  }
  .state-btn {
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 7px 16px; cursor: pointer;
    transition: all 0.2s;
  }
  .state-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .state-btn.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); color: var(--text-primary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 18px;
    padding: 20px clamp(16px,4vw,64px) 80px;
    max-width: 1400px; margin: 0 auto;
  }
  .grid-app {
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
  }

  .card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.3);
  }
  .card.selected {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 1px var(--accent-blue), 0 16px 48px rgba(77,142,247,0.1);
  }
  .card.selected::after {
    content:'✓'; position:absolute; top:12px; right:12px;
    width:22px; height:22px;
    background: var(--accent-blue); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; z-index:5;
  }

  .preview {
    position: relative; height: 170px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .preview-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #1a1c2e 0%, #141624 40%, #0d1020 100%);
  }
  .preview-bg .ln {
    position: absolute; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.025);
  }
  .preview-bg .ln:nth-child(1) { top:48px; left:28px; width:55%; }
  .preview-bg .ln:nth-child(2) { top:60px; left:28px; width:38%; }
  .preview-bg .ln:nth-child(3) { top:72px; left:28px; width:48%; }
  .preview-bg .ln:nth-child(4) { top:84px; left:28px; width:28%; }

  .preview-app {
    height: auto; min-height: 460px;
    padding: 24px;
    align-items: flex-start; justify-content: center;
  }
  .preview-app .preview-bg {
    background: linear-gradient(160deg, #12141e 0%, #0c0e18 100%);
  }

  .card-meta {
    padding: 14px 18px;
    border-top: 1px solid var(--border-subtle);
  }
  .card-meta h3 {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center;
    margin-bottom: 3px;
  }
  .card-meta p { color: var(--text-secondary); font-size: 11.5px; line-height: 1.5; }
  .card-number {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-subtle);
    font-size: 9px; font-weight: 700;
    color: var(--text-muted); margin-right: 8px; flex-shrink: 0;
  }
  .tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 9.5px; font-weight: 500; letter-spacing: 0.3px;
    padding: 2px 7px; border-radius: 4px;
    background: rgba(255,255,255,0.04); color: var(--text-secondary);
  }

  .summary-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 28px;
    background: rgba(14,16,24,0.88);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .summary-bar.visible { transform: translateY(0); }
  .summary-text { font-size: 13px; color: var(--text-secondary); }
  .summary-text strong { color: var(--text-primary); }
  .btn-clear, .btn-confirm {
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 7px 18px; border-radius: 8px; cursor: pointer;
    transition: all 0.2s; border: none;
  }
  .btn-clear { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
  .btn-clear:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .btn-confirm { background: var(--accent-blue); color: #fff; }
  .btn-confirm:hover { background: #5c9af8; }
  .summary-actions { display: flex; gap: 8px; }

  /* ════════════════════════════════════════ */
  /* HUD STYLES */
  /* ════════════════════════════════════════ */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  @keyframes shimmer { 0%{background-position:-200% center}100%{background-position:200% center} }
  @keyframes waveform { 0%,100%{height:4px}50%{height:14px} }
  @keyframes dotPulse { 0%,80%,100%{transform:scale(0);opacity:.5}40%{transform:scale(1);opacity:1} }

  .hud { position:relative; z-index:2; display:inline-flex; align-items:center; gap:10px; white-space:nowrap; font-family:'Inter',sans-serif; }
  .spinner { width:16px; height:16px; border:2px solid transparent; border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }
  .hud-text { font-weight:500; letter-spacing:-0.1px; }
  .hud-icon { flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .icon-check,.icon-x { width:14px; height:14px; }

  .hud-v1{background:rgba(15,17,26,.72);backdrop-filter:blur(40px) saturate(160%);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 20px;box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
  .hud-v1 .spinner{border-top-color:#7aa2f7;border-right-color:rgba(122,162,247,.3)}
  .hud-v1 .hud-text{color:#c0c8dc;font-size:13px}
  .hud-v1.success .hud-text{color:var(--accent-green)}.hud-v1.error .hud-text{color:var(--accent-red)}
  .hud-v1.success{border-color:rgba(52,211,153,.15)}.hud-v1.error{border-color:rgba(248,113,113,.15)}

  .hud-v2{background:linear-gradient(135deg,rgba(30,33,48,.8),rgba(20,22,35,.9));backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.07);border-radius:100px;padding:8px 22px 8px 14px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.2)}
  .hud-v2 .spinner{border-top-color:#60a5fa;border-right-color:rgba(96,165,250,.2);width:14px;height:14px}
  .hud-v2 .hud-text{color:#94a3b8;font-size:12.5px}
  .hud-v2.success .hud-text{color:var(--accent-green)}.hud-v2.error .hud-text{color:var(--accent-red)}
  .hud-v2.success{background:linear-gradient(135deg,rgba(20,40,35,.8),rgba(15,25,22,.9))}.hud-v2.error{background:linear-gradient(135deg,rgba(45,20,22,.8),rgba(30,15,18,.9))}

  .hud-v3{background:rgba(8,9,14,.88);backdrop-filter:blur(48px);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:10px 18px;box-shadow:0 2px 16px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.04)}
  .hud-v3 .spinner{width:14px;height:14px;border-width:1.5px;border-top-color:#a78bfa;border-right-color:rgba(167,139,250,.2)}
  .hud-v3 .hud-text{color:#8b8fa4;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
  .hud-v3.success .hud-text{color:var(--accent-green)}.hud-v3.error .hud-text{color:var(--accent-red)}
  .hud-v3.success{border-bottom:2px solid rgba(52,211,153,.4)}.hud-v3.error{border-bottom:2px solid rgba(248,113,113,.4)}

  .hud-v4{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.02) 50%,rgba(255,255,255,.04));backdrop-filter:blur(32px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 20px;box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 20px rgba(255,255,255,.02)}
  .hud-v4 .spinner{border-top-color:#f0c040;border-right-color:rgba(240,192,64,.2)}
  .hud-v4 .hud-text{color:#d4d8e8;font-size:13px}
  .hud-v4.success .hud-text{color:var(--accent-green)}.hud-v4.error .hud-text{color:var(--accent-red)}

  .hud-v5{background:rgba(22,24,36,.85);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.06);border-radius:100px;padding:7px 18px 7px 10px;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.45),inset 0 .5px 0 rgba(255,255,255,.08)}
  .hud-v5 .hud-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-blue);animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
  .hud-v5.success .hud-dot{background:var(--accent-green);animation:none}.hud-v5.error .hud-dot{background:var(--accent-red);animation:none}
  .hud-v5 .hud-text{color:#8892ac;font-size:12px}
  .hud-v5.success .hud-text{color:#a0b8a8}.hud-v5.error .hud-text{color:#b8a0a0}

  .hud-v6{background:linear-gradient(180deg,rgba(32,34,46,.9),rgba(18,20,30,.95));backdrop-filter:blur(36px);border:1px solid rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 18px;box-shadow:0 6px 24px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3)}
  .hud-v6 .spinner{width:13px;height:13px;border-width:1.5px;border-top-color:#60a5fa;border-right-color:transparent}
  .hud-v6 .hud-text{color:#9ca3b4;font-size:13px}
  .hud-v6 .hud-sep{width:1px;height:14px;background:rgba(255,255,255,.08);flex-shrink:0}
  .hud-v6 .hud-label{font-size:10px;font-weight:600;letter-spacing:.5px;color:#4d5570;text-transform:uppercase}
  .hud-v6.success .hud-text{color:var(--accent-green)}.hud-v6.error .hud-text{color:var(--accent-red)}

  .hud-v7{position:relative;background:rgba(12,14,22,.82);backdrop-filter:blur(40px) saturate(140%);border-radius:10px;padding:10px 20px;border:1px solid rgba(255,255,255,.05);box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden}
  .hud-v7::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-blue),#a78bfa,transparent);background-size:200% 100%;animation:shimmer 2.5s ease-in-out infinite}
  .hud-v7.success::before{background:linear-gradient(90deg,transparent,var(--accent-green),#6ee7b7,transparent);background-size:200% 100%;animation:shimmer 2.5s ease-in-out infinite}
  .hud-v7.error::before{background:linear-gradient(90deg,transparent,var(--accent-red),#fca5a5,transparent);background-size:200% 100%;animation:shimmer 2.5s ease-in-out infinite}
  .hud-v7 .spinner{border-top-color:#818cf8;border-right-color:rgba(129,140,248,.2)}
  .hud-v7 .hud-text{color:#b0b8d0;font-size:13px}
  .hud-v7.success .hud-text{color:var(--accent-green)}.hud-v7.error .hud-text{color:var(--accent-red)}

  .hud-v8{background:linear-gradient(135deg,rgba(24,26,38,.92),rgba(16,18,28,.95));backdrop-filter:blur(48px);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
  .hud-v8 .waveform{display:flex;gap:2px;align-items:center;height:16px}
  .hud-v8 .waveform .bar{width:2.5px;border-radius:2px;background:var(--accent-blue);animation:waveform .8s ease-in-out infinite}
  .hud-v8 .waveform .bar:nth-child(2){animation-delay:.1s}.hud-v8 .waveform .bar:nth-child(3){animation-delay:.2s}.hud-v8 .waveform .bar:nth-child(4){animation-delay:.3s}
  .hud-v8.success .waveform .bar{background:var(--accent-green);animation:none;height:10px}
  .hud-v8.error .waveform .bar{background:var(--accent-red);animation:none;height:3px}
  .hud-v8 .hud-text{color:#a0a8c0;font-size:13px;font-weight:400}
  .hud-v8.success .hud-text{color:var(--accent-green)}.hud-v8.error .hud-text{color:var(--accent-red)}

  .hud-v9{background:rgba(20,22,32,.6);backdrop-filter:blur(60px);border:none;border-radius:8px;padding:8px 16px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
  .hud-v9 .dots{display:flex;gap:4px;align-items:center}
  .hud-v9 .dots span{width:5px;height:5px;border-radius:50%;background:#6b7084;animation:dotPulse 1.4s ease-in-out infinite}
  .hud-v9 .dots span:nth-child(2){animation-delay:.16s}.hud-v9 .dots span:nth-child(3){animation-delay:.32s}
  .hud-v9 .hud-text{color:#707488;font-size:12px;font-weight:500}
  .hud-v9.success .hud-text{color:var(--accent-green)}.hud-v9.error .hud-text{color:var(--accent-red)}
  .hud-v9.success .dots span,.hud-v9.error .dots span{animation:none}
  .hud-v9.success .dots span{background:var(--accent-green)}.hud-v9.error .dots span{background:var(--accent-red)}

  .hud-v10{background:rgba(16,18,28,.7);backdrop-filter:blur(36px) saturate(180%);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 20px 10px 14px;box-shadow:0 8px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
  .hud-v10 .ring-spinner{position:relative;width:18px;height:18px;flex-shrink:0}
  .hud-v10 .ring-spinner::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(77,142,247,.15)}
  .hud-v10 .ring-spinner::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent-blue);animation:spin .9s linear infinite}
  .hud-v10.success .ring-spinner::after{border-top-color:var(--accent-green);animation:none;border-color:var(--accent-green)}
  .hud-v10.error .ring-spinner::after{border-top-color:var(--accent-red);animation:none;border-color:var(--accent-red)}
  .hud-v10.success .ring-spinner::before{border-color:rgba(52,211,153,.2)}
  .hud-v10.error .ring-spinner::before{border-color:rgba(248,113,113,.2)}
  .hud-v10 .hud-text{color:#9ca3b8;font-size:13px;font-weight:500}
  .hud-v10.success .hud-text{color:var(--accent-green)}.hud-v10.error .hud-text{color:var(--accent-red)}

  /* ════════════════════════════════════════ */
  /* APP WINDOW STYLES */
  /* ════════════════════════════════════════ */
  .app-window {
    position: relative; z-index: 2;
    width: 100%; max-width: 340px;
    font-family: 'Inter', sans-serif;
    border-radius: 14px;
    overflow: hidden;
    font-size: 12px;
    transform: scale(0.92);
    transform-origin: top center;
  }
  .app-window .aw-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; }
  .app-window .aw-title { font-weight:600; font-size:14px; }
  .app-window .aw-controls { display:flex; gap:2px; }
  .app-window .aw-ctrl { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; cursor:default; transition:background .15s; border:none; background:transparent; }
  .app-window .aw-body { padding:0 18px 18px; }
  .app-window .aw-row { display:flex; gap:10px; margin-bottom:14px; }
  .app-window .aw-field { flex:1; }
  .app-window .aw-label { display:block; font-size:10.5px; font-weight:500; margin-bottom:5px; letter-spacing:0.2px; }
  .app-window .aw-input { width:100%; padding:8px 12px; border-radius:6px; font-family:inherit; font-size:11.5px; border:1px solid transparent; outline:none; transition:border-color .2s; }
  .app-window .aw-select { width:100%; padding:8px 12px; border-radius:6px; font-family:inherit; font-size:11.5px; appearance:none; cursor:pointer; border:1px solid transparent; outline:none; background-repeat:no-repeat; background-position:right 10px center; background-size:10px; }
  .app-window .aw-sep { border:none; height:1px; margin:14px 0; }
  .app-window .aw-toggle-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  .app-window .aw-toggle-label { font-size:12px; font-weight:500; }
  .app-window .aw-toggle { width:36px; height:20px; border-radius:10px; position:relative; cursor:pointer; transition:background .2s; }
  .app-window .aw-toggle::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; transition:transform .2s; }
  .app-window .aw-toggle.on::after { transform:translateX(16px); }
  .app-window .aw-btn { width:100%; padding:10px; border-radius:8px; font-family:inherit; font-size:12.5px; font-weight:600; border:none; cursor:pointer; transition:all .2s; margin-top:6px; }
  .app-window .aw-hint { display:block; font-size:9.5px; opacity:0.35; margin:4px 0 0 2px; }

  /* V1 Frosted Noir */
  .app-v1{background:rgba(15,17,26,.82);backdrop-filter:blur(40px) saturate(160%);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 48px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
  .app-v1 .aw-header{border-bottom:1px solid rgba(255,255,255,.05)}.app-v1 .aw-title{color:#d0d4e0}
  .app-v1 .aw-ctrl{color:#606880}.app-v1 .aw-ctrl:nth-last-child(1):hover{background:#e81123;color:#fff}

  {id:10,name:'Glassmorphic Ring',desc:'Классический glass + кольцевой спиннер',tags:['glass','ring','balanced'],html:s=>`<div class="hud hud-v10${s!=='translating'?' '+s:''}"><div class="ring-spinner"></div><span class="hud-text">${s==='translating'?'Translating…':s==='success'?'Done':'Error'}</span></div>`},
];

  return `<div class="app-window app-v${v}">
  <div class="aw-header"><span class="aw-title">Flow Settings</span><div class="aw-controls"><span class="aw-ctrl">─</span><span class="aw-ctrl">✕</span></div></div>
  <div class="aw-body">
    <div class="aw-row"><div class="aw-field"><label class="aw-label">App Theme</label><select class="aw-select"><option>Dark</option></select></div><div class="aw-field"><label class="aw-label">Translation Hotkey</label><input class="aw-input" value="Ctrl + Shift + T" readonly></div></div>
    <div class="aw-row"><div class="aw-field"><label class="aw-label">Source Language</label><select class="aw-select"><option>Russian</option></select></div><div class="aw-field"><label class="aw-label">Target Language</label><select class="aw-select"><option>English</option></select></div></div>
    <div class="aw-field" style="margin-bottom:14px"><label class="aw-label">Translation Provider</label><select class="aw-select"><option>DeepL (BYOK)</option></select></div>
    <div class="aw-field"><label class="aw-label">API Key</label><input class="aw-input" value="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" readonly></div>
    <span class="aw-hint">Stored in Windows Credential Manager</span>
    <hr class="aw-sep">
    <div class="aw-toggle-row"><span class="aw-toggle-label">Launch with Windows</span><div class="aw-toggle on" onclick="this.classList.toggle('on')"></div></div>
    <div class="aw-toggle-row" style="margin-bottom:8px"><span class="aw-toggle-label">Show HUD Indicator</span><div class="aw-toggle on" onclick="this.classList.toggle('on')"></div></div>
    <button class="aw-btn">Save Settings</button>
  </div></div>`;
}

const appMeta=[
  {id:1,name:'Frosted Noir',desc:'Морозный blur, тонкие грани, глубокий тёмный',tags:['dark','frost','soft']},
  {id:2,name:'Liquid Capsule',desc:'Скруглённые формы, жидкий градиент, капсульные инпуты',tags:['pill','liquid','smooth']},
  {id:3,name:'Obsidian Slab',desc:'Ультра-тёмный, uppercase лейблы, острые формы',tags:['obsidian','sharp','mono']},
  {id:4,name:'Glass Prism',desc:'Призматический glass, тёплые акценты, золотая кнопка',tags:['glass','prism','gold']},
  {id:5,name:'Whisper Pill',desc:'Супер-скруглённый, минимальный, амбиентный',tags:['whisper','rounded','ambient']},
  {id:6,name:'Titanium Edge',desc:'Структурированный титан, чёткий верхний блик',tags:['titanium','edge','structured']},
  {id:7,name:'Aurora Bar',desc:'Aurora-полоса, индиго-акценты, мерцание',tags:['aurora','indigo','shimmer']},
  {id:8,name:'Carbon Float',desc:'Карбон, floating-тень, мягкие скругления',tags:['carbon','deep','float']},
  {id:9,name:'Minimal Smoke',desc:'Максимально приглушённый, без рамок, дым',tags:['minimal','smoke','ghost']},
  {id:10,name:'Glassmorphic Ring',desc:'Сбалансированный glass, сатурация, чёткость',tags:['glass','balanced','classic']},
];

let hudState='translating';
let selectedHud=new Set();
let selectedApp=new Set();

function renderHudGrid(){
  document.getElementById('hud-grid').innerHTML=huds.map(h=>`
    <div class="card${selectedHud.has(h.id)?' selected':''}" data-id="${h.id}" onclick="toggleHud(${h.id})">
      <div class="preview"><div class="preview-bg"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>${h.html(hudState)}</div>
      <div class="card-meta"><h3><span class="card-number">${h.id}</span>${h.name}</h3><p>${h.desc}</p><div class="tags">${h.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    </div>`).join('');
}
function renderAppGrid(){
  document.getElementById('app-grid').innerHTML=appMeta.map(a=>`
    <div class="card${selectedApp.has(a.id)?' selected':''}" data-id="${a.id}" onclick="toggleApp(${a.id})">
      <div class="preview preview-app"><div class="preview-bg"></div>${appHTML(a.id)}</div>
      <div class="card-meta"><h3><span class="card-number">${a.id}</span>${a.name}</h3><p>${a.desc}</p><div class="tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    </div>`).join('');
}

function setHudState(s){
  hudState=s;
  document.querySelectorAll('#hud-state-bar .state-btn').forEach(b=>b.classList.toggle('active',b.dataset.state===s));
  renderHudGrid();
}
function toggleHud(id){selectedHud.has(id)?selectedHud.delete(id):selectedHud.add(id);updateUI()}
function toggleApp(id){selectedApp.has(id)?selectedApp.delete(id):selectedApp.add(id);updateUI()}
function updateUI(){
  document.querySelectorAll('#hud-grid .card').forEach(c=>c.classList.toggle('selected',selectedHud.has(+c.dataset.id)));
  document.querySelectorAll('#app-grid .card').forEach(c=>c.classList.toggle('selected',selectedApp.has(+c.dataset.id)));
  const t=selectedHud.size+selectedApp.size;
  document.getElementById('selectedCount').textContent=t;
  document.getElementById('summaryBar').classList.toggle('visible',t>0);
}
function clearAll(){selectedHud.clear();selectedApp.clear();updateUI()}
function confirmAll(){
  const h=[...selectedHud].sort().map(id=>`HUD #${id}: ${huds.find(x=>x.id===id).name}`);
  const a=[...selectedApp].sort().map(id=>`App #${id}: ${appMeta.find(x=>x.id===id).name}`);
  if(!h.length&&!a.length)return;
  alert('Твой выбор:\n\n'+(h.length?'── HUD ──\n'+h.join('\n')+'\n\n':'')+(a.length?'── APP ──\n'+a.join('\n'):'')+'\n\nСкопируй и отправь в чат!');
}
function switchTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  if(tab==='hud'){document.querySelector('.nav-btn:nth-child(1)').classList.add('active');document.getElementById('sec-hud').classList.add('active')}
  else{document.querySelector('.nav-btn:nth-child(2)').classList.add('active');document.getElementById('sec-app').classList.add('active')}
}
renderHudGrid();renderAppGrid();
</script>
</body>
</html>
